name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -q
      - name: Verify AI-BOM is fresh
        run: uv run python security/gen_aibom.py --check
